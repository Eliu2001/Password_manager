name: Verify

on:
  push:
  pull_request:

jobs:
  verify-linux:
    name: Java 21 / Linux filesystem checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify project
        run: bash ./mvnw verify
