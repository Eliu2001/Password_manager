name: Verify

on:
  push:
  pull_request:

jobs:
  verify-linux:
    name: Java 21 / Linux filesystem checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify project
        run: bash ./mvnw verify
      - name: Verify packaged CLI
        shell: bash
        run: |
          test -f target/password-vault.jar
          entries="$(jar tf target/password-vault.jar)"
          grep -Fxq 'org/bouncycastle/jce/provider/BouncyCastleProvider.class' <<< "$entries"
          grep -Fxq 'META-INF/LICENSE.md' <<< "$entries"
          grep -Fxq 'META-INF/services/java.security.Provider' <<< "$entries"
          provider="$(unzip -p target/password-vault.jar META-INF/services/java.security.Provider)"
          grep -Fxq 'org.bouncycastle.jce.provider.BouncyCastleProvider' <<< "$provider"
          if grep -Eq '^(org/junit|org/jupiter)/' <<< "$entries"; then
            echo 'Test dependency unexpectedly packaged' >&2
            exit 1
          fi
          manifest="$(unzip -p target/password-vault.jar META-INF/MANIFEST.MF)"
          grep -Fxq 'Main-Class: cl.germain.vault.cli.Main' <<< "$manifest"
          help="$(java -jar target/password-vault.jar --help)"
          grep -Fq 'Main create --vault <ruta>' <<< "$help"
          grep -Fq 'Comandos: create, add, list, show, delete, generate, set-totp, remove-totp, totp, upgrade, session' <<< "$help"
          sha256sum target/password-vault.jar | cut -d ' ' -f 1 > target/password-vault.jar.sha256
          expected="$(cat target/password-vault.jar.sha256)"
          actual="$(sha256sum target/password-vault.jar | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
